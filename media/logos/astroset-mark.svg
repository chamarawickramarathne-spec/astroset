<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f08c3c"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4ff"/>
      <stop offset="1" stop-color="#aab6ee"/>
    </linearGradient>
    <clipPath id="horizonClip">
      <rect x="0" y="0" width="1024" height="668"/>
    </clipPath>
    <mask id="crescentMask">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <circle cx="362" cy="256" r="92" fill="black"/>
    </mask>
  </defs>

  <g fill="#ffffff">
    <circle cx="152" cy="182" r="5" opacity="0.9"/>
    <circle cx="252" cy="118" r="3.5" opacity="0.6"/>
    <circle cx="702" cy="138" r="6" opacity="0.85"/>
    <circle cx="846" cy="262" r="4" opacity="0.7"/>
    <circle cx="906" cy="482" r="4.5" opacity="0.5"/>
    <circle cx="128" cy="524" r="3.5" opacity="0.5"/>
    <circle cx="602" cy="86" r="3" opacity="0.6"/>
    <circle cx="424" cy="158" r="3.5" opacity="0.55"/>
    <circle cx="806" cy="392" r="3" opacity="0.45"/>
  </g>

  <ellipse cx="512" cy="648" rx="352" ry="104" fill="none"
           stroke="#4a9eff" stroke-width="14" opacity="0.6"
           transform="rotate(-16 512 648)"/>

  <g clip-path="url(#horizonClip)">
    <circle cx="512" cy="668" r="212" fill="url(#sun)"/>
  </g>

  <rect x="122" y="660" width="780" height="14" rx="7" fill="#4a9eff" opacity="0.9"/>

  <circle cx="838" cy="576" r="17" fill="#4a9eff"/>

  <circle cx="316" cy="298" r="106" fill="url(#moon)" mask="url(#crescentMask)"/>
